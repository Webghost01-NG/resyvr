[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib", "../node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[lint]
lint_on_build = false

[invariant]
runs = 64
depth = 32
fail_on_revert = true
